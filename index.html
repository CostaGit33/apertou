<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Apertou Gravou - Arena Online</title>

    <style>
        :root {
            --primary: #00ff84;
            --danger: #ff4444;
            --bg: #0a0a0a;
            --card-bg: #111;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: #fff; line-height: 1.5; }

        header {
            padding: 1rem 5%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.25rem; font-weight: 900; color: var(--primary); letter-spacing: 1px; }
        .logo small { font-size: 0.6rem; color: #555; vertical-align: middle; }

        #status { font-size: 0.8rem; font-weight: bold; transition: 0.3s; }
        .online { color: var(--primary); }
        .offline { color: var(--danger); }

        main { max-width: 1000px; margin: auto; padding: 20px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; height: fit-content; }
        .title { font-size: 0.9rem; font-weight: 800; margin-bottom: 15px; color: #aaa; text-transform: uppercase; }

        #saveBtn {
            width: 100%;
            padding: 35px 20px;
            border: none;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: 900;
            background: var(--primary);
            color: #000;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 132, 0.15);
        }

        #saveBtn:hover { transform: scale(1.01); background: #00db72; }
        #saveBtn:active { transform: scale(0.98); }
        #saveBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background: #333; color: #666; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .box { background: #0d0d0d; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #1a1a1a; }
        .box small { display: block; color: #666; font-size: 0.7rem; margin-bottom: 4px; }
        .box strong { font-size: 1.25rem; color: var(--primary); }

        .list { display: grid; gap: 10px; max-height: 550px; overflow-y: auto; padding-right: 5px; }
        .list::-webkit-scrollbar { width: 4px; }
        .list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .item {
            background: #0d0d0d;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1a1a1a;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .item-info strong { display: block; font-size: 0.9rem; color: #eee; }
        .item-info span { font-size: 0.75rem; color: #555; }

        .actions { display: flex; gap: 8px; }
        .btn-mini {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-view { background: #222; color: #fff; }
        .btn-view:hover { background: #333; }
        .btn-r2 { background: #0070f3; color: #fff; }
        .btn-r2:hover { background: #0060d0; }

        footer { padding: 40px 20px; text-align: center; color: #444; font-size: 0.75rem; }
    </style>
</head>

<body>

<header>
    <div class="logo">APERTOU GRAVOU <small>v6 ONLINE</small></div>
    <div id="status">● VERIFICANDO...</div>
</header>

<main>
    <div class="grid">
        <div class="card">
            <div class="title">Controle de Gravação</div>
            
            <button id="saveBtn" onclick="gravar()">⚽ GRAVAR LANCE</button>

            <div class="stats">
                <div class="box">
                    <small>BUFFER ATIVO</small>
                    <strong id="buffer">--</strong>
                </div>
                <div class="box">
                    <small>TOTAL CLIPS</small>
                    <strong id="total">0</strong>
                </div>
            </div>
            
            <p style="margin-top: 20px; color: #555; font-size: 11px;">
                * O sistema processa os últimos segundos do buffer circular, aplica a logo e sincroniza com a Cloud R2.
            </p>
        </div>

        <div class="card">
            <div class="title">Últimos Replays</div>
            <div class="list" id="clips">
                <div style="text-align: center; padding: 20px; color: #444;">Buscando replays...</div>
            </div>
        </div>
    </div>
</main>

<footer>
    Arena Jaguar • Sistema Profissional de Replays • R2 Cloud Ativo
</footer>

<script>
    /**
     * Ajuste automático da API: 
     * Se você acessar pelo celular, ele tentará usar o IP do notebook. 
     * Caso contrário, usa localhost. Substitua o IP abaixo pelo do seu notebook.
     */
    const IP_NOTEBOOK = "192.168.1.105"; 
    const API = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
                ? "http://localhost:8080" 
                : `http://${IP_NOTEBOOK}:8080`;

    async function statusLoad() {
        const statusEl = document.getElementById("status");
        try {
            const r = await fetch(`${API}/api/status`, { signal: AbortSignal.timeout(3000) });
            if(!r.ok) throw new Error();
            const j = await r.json();

            statusEl.innerHTML = '<span class="online">● SISTEMA ONLINE</span>';
            document.getElementById("buffer").innerText = (j.buffer_seconds || 0) + "s";
        } catch (e) {
            statusEl.innerHTML = '<span class="offline">● SISTEMA OFFLINE</span>';
        }
    }

    async function clipsLoad() {
        const listEl = document.getElementById("clips");
        try {
            const r = await fetch(`${API}/api/clips`);
            const list = await r.json();

            document.getElementById("total").innerText = list.length;
            
            if (list.length === 0) {
                listEl.innerHTML = "<div style='color:#444; text-align:center; padding:20px;'>Nenhum replay gerado ainda.</div>";
                return;
            }

            const html = list.map(item => `
                <div class="item">
                    <div class="item-info">
                        <strong>${item.created_at || 'Agora'}</strong>
                        <span>${item.size_mb ? item.size_mb + ' MB' : 'Processado'}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-mini btn-view" onclick="verClip('${item.url}')">VER</button>
                        <a href="${item.r2_url || item.url}" target="_blank" class="btn-mini btn-r2">CLOUD</a>
                    </div>
                </div>
            `).join('');

            listEl.innerHTML = html;
        } catch (e) {
            console.error("Erro ao carregar clips", e);
        }
    }

    async function gravar() {
        const btn = document.getElementById("saveBtn");
        const originalText = btn.innerText;
        
        btn.disabled = true;
        btn.innerText = "⏳ PROCESSANDO...";
        btn.style.background = "#333";

        try {
            const r = await fetch(`${API}/api/trigger`, { method: "POST" });
            const j = await r.json();

            if (j.success) {
                btn.innerText = "✅ SUCESSO!";
                btn.style.background = "var(--primary)";
                btn.style.color = "#000";
                setTimeout(clipsLoad, 1500);
            } else {
                throw new Error();
            }
        } catch (e) {
            btn.innerText = "❌ ERRO NA CONEXÃO";
            btn.style.background = "var(--danger)";
            btn.style.color = "#fff";
        }

        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = originalText;
            btn.style.background = "";
            btn.style.color = "";
        }, 4000);
    }

    function verClip(url) {
        // Se a URL for relativa, anexa o endereço da API
        const finalUrl = url.startsWith('http') ? url : `${API}${url}`;
        window.open(finalUrl, "_blank");
    }

    // Inicialização
    statusLoad();
    clipsLoad();

    // Loops de atualização
    setInterval(statusLoad, 5000);
    setInterval(clipsLoad, 10000);
</script>

</body>
</html>
