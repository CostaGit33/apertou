<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Apertou Gravou - Arena Jaguar</title>

    <style>
        :root {
            --primary: #00ff84;
            --danger: #ff4444;
            --bg: #0a0a0a;
            --card-bg: #111;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: #fff; line-height: 1.5; }

        header {
            padding: 1rem 5%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.25rem; font-weight: 900; color: var(--primary); letter-spacing: 1px; }
        #status { font-size: 0.8rem; font-weight: bold; }
        .online { color: var(--primary); }
        .offline { color: var(--danger); }

        main { max-width: 1000px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        .title { font-size: 0.9rem; font-weight: 800; margin-bottom: 15px; color: #aaa; text-transform: uppercase; }

        #saveBtn {
            width: 100%;
            padding: 35px 20px;
            border: none;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: 900;
            background: var(--primary);
            color: #000;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 132, 0.15);
        }

        #saveBtn:disabled { opacity: 0.5; cursor: not-allowed; background: #333; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .box { background: #0d0d0d; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #1a1a1a; }
        .box small { display: block; color: #666; font-size: 0.7rem; }
        .box strong { font-size: 1.25rem; color: var(--primary); }

        .list { display: grid; gap: 10px; max-height: 550px; overflow-y: auto; }
        .item {
            background: #0d0d0d;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1a1a1a;
        }

        .btn-view { 
            padding: 8px 14px; background: #0070f3; color: #fff; 
            border-radius: 8px; text-decoration: none; font-size: 0.75rem; font-weight: bold;
        }

        footer { padding: 40px 20px; text-align: center; color: #444; font-size: 0.75rem; }
    </style>
</head>
<body>

<header>
    <div class="logo">APERTOU GRAVOU <small>v6 VPS</small></div>
    <div id="status">● VERIFICANDO...</div>
</header>

<main>
    <div class="grid">
        <div class="card">
            <div class="title">Controle de Gravação</div>
            <button id="saveBtn" onclick="gravar()">⚽ GRAVAR LANCE</button>
            <div class="stats">
                <div class="box"><small>STATUS VPS</small><strong id="vps-status">...</strong></div>
                <div class="box"><small>TOTAL CLIPS</small><strong id="total">0</strong></div>
            </div>
        </div>

        <div class="card">
            <div class="title">Últimos Replays (Nuvem R2)</div>
            <div class="list" id="clips">Carregando...</div>
        </div>
    </div>
</main>

<footer>Arena Jaguar • Apertou Gravou</footer>

<script>
    // ─── CONFIGURAÇÃO ───────────────────────────────────────────────
    // ⚠️  Edite apenas estas duas linhas se mudar de VPS ou bucket R2:
    const IP_VPS        = "76.13.68.129";
    const R2_PUBLIC_URL = "https://pub-172de93c1f6b4da4bd4279b3ee4148c8.r2.dev"; // ← mesma do config.json
    // ────────────────────────────────────────────────────────────────

    const API = `http://${IP_VPS}:8080`;

    async function statusLoad() {
        const statusEl = document.getElementById("status");
        try {
            const r = await fetch(`${API}/api/status`, { signal: AbortSignal.timeout(3000) });
            if (r.ok) {
                statusEl.innerHTML = '<span class="online">● VPS CONECTADA</span>';
                document.getElementById("vps-status").innerText = "ONLINE";
            }
        } catch (e) {
            statusEl.innerHTML = '<span class="offline">● VPS OFFLINE</span>';
            document.getElementById("vps-status").innerText = "ERRO";
        }
    }

    async function clipsLoad() {
        try {
            const r = await fetch(`${R2_PUBLIC_URL}/clips.json?t=${Date.now()}`);
            if (!r.ok) throw new Error("clips.json não encontrado");
            const list = await r.json();
            document.getElementById("total").innerText = list.length;

            let html = list.length === 0
                ? "<div style='color:#444;text-align:center;'>Nenhum vídeo ainda.</div>"
                : "";

            list.forEach(item => {
                html += `
                <div class="item">
                    <div class="item-info">
                        <strong>LANCE ${item.time}</strong>
                        <span style="font-size:10px;color:#555;">Arena Jaguar</span>
                    </div>
                    <a href="${item.url}" target="_blank" class="btn-view">VER REPLAY</a>
                </div>`;
            });
            document.getElementById("clips").innerHTML = html;
        } catch (e) {
            document.getElementById("clips").innerHTML = "<div style='color:#444;text-align:center;'>Aguardando vídeos na nuvem...</div>";
        }
    }

    async function gravar() {
        const btn = document.getElementById("saveBtn");
        btn.disabled = true;
        btn.innerText = "⏳ PROCESSANDO...";

        try {
            const r = await fetch(`${API}/api/trigger`, { method: "POST" });
            const j = await r.json();
            if (j.success) {
                btn.innerText = "✅ GRAVADO!";
                setTimeout(clipsLoad, 6000); // aguarda upload completar
            } else {
                btn.innerText = "❌ FALHOU";
            }
        } catch (e) {
            alert("Não foi possível conectar à VPS (" + IP_VPS + ":8080). Verifique o firewall.");
            btn.innerText = "❌ ERRO";
        }

        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "⚽ GRAVAR LANCE";
        }, 7000);
    }

    statusLoad();
    clipsLoad();
    setInterval(statusLoad, 5000);
    setInterval(clipsLoad, 15000);
</script>
</body>
</html>
