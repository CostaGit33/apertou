<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Apertou Gravou - Arena Jaguar</title>

    <style>
        :root {
            --primary: #00ff84;
            --danger: #ff4444;
            --bg: #0a0a0a;
            --card-bg: #111;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: #fff; line-height: 1.5; }

        header {
            padding: 1rem 5%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.25rem; font-weight: 900; color: var(--primary); letter-spacing: 1px; }
        .logo small { font-size: 0.6rem; color: #555; vertical-align: middle; }

        #status { font-size: 0.8rem; font-weight: bold; transition: 0.3s; }
        .online { color: var(--primary); }
        .offline { color: var(--danger); }

        main { max-width: 1000px; margin: auto; padding: 20px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; height: fit-content; }
        .title { font-size: 0.9rem; font-weight: 800; margin-bottom: 15px; color: #aaa; text-transform: uppercase; }

        #saveBtn {
            width: 100%;
            padding: 35px 20px;
            border: none;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: 900;
            background: var(--primary);
            color: #000;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 132, 0.15);
        }

        #saveBtn:hover { transform: scale(1.01); background: #00db72; }
        #saveBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background: #333; color: #666; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .box { background: #0d0d0d; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #1a1a1a; }
        .box small { display: block; color: #666; font-size: 0.7rem; margin-bottom: 4px; }
        .box strong { font-size: 1.25rem; color: var(--primary); }

        .list { display: grid; gap: 10px; max-height: 550px; overflow-y: auto; padding-right: 5px; }
        .list::-webkit-scrollbar { width: 4px; }
        .list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .item {
            background: #0d0d0d;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1a1a1a;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .item-info strong { display: block; font-size: 0.9rem; color: #eee; }
        .item-info span { font-size: 0.75rem; color: #555; }

        .actions { display: flex; gap: 8px; }
        .btn-mini {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-view { background: #0070f3; color: #fff; }
        .btn-view:hover { background: #0060d0; }

        footer { padding: 40px 20px; text-align: center; color: #444; font-size: 0.75rem; }
    </style>
</head>

<body>

<header>
    <div class="logo">APERTOU GRAVOU <small>v6 ONLINE</small></div>
    <div id="status">● VERIFICANDO...</div>
</header>

<main>
    <div class="grid">
        <div class="card">
            <div class="title">Controle de Gravação</div>
            <button id="saveBtn" onclick="gravar()">⚽ GRAVAR LANCE</button>

            <div class="stats">
                <div class="box">
                    <small>STATUS R2</small>
                    <strong id="cloud-status">OK</strong>
                </div>
                <div class="box">
                    <small>TOTAL CLIPS</small>
                    <strong id="total">0</strong>
                </div>
            </div>
            
            <p style="margin-top: 20px; color: #555; font-size: 11px;">
                * Os vídeos são processados localmente e enviados para o Cloudflare R2 automaticamente.
            </p>
        </div>

        <div class="card">
            <div class="title">Últimos Replays</div>
            <div class="list" id="clips">
                <div style="text-align: center; padding: 20px; color: #444;">Buscando replays na nuvem...</div>
            </div>
        </div>
    </div>
</main>

<footer>
    Arena Jaguar • videos.semdominio.online • R2 Storage
</footer>

<script>
    // --- CONFIGURAÇÕES CRÍTICAS ---
    // URL Pública que aparece na sua captura de tela do R2
    const R2_PUBLIC_URL = "https://pub-172de93c1f6b4da4bd4279b3ee4148c8.r2.dev";
    
    // IP do seu notebook para o comando de gravação (Trigger)
    const IP_NOTEBOOK = "192.168.1.105"; 
    const API_LOCAL = `http://${IP_NOTEBOOK}:8080`;

    // 1. Carrega os vídeos direto do R2 (clips.json)
    async function clipsLoad() {
        const listEl = document.getElementById("clips");
        try {
            // Buscamos o arquivo JSON que o main.py envia para a nuvem
            const r = await fetch(`${R2_PUBLIC_URL}/clips.json?t=${Date.now()}`);
            if(!r.ok) throw new Error();
            
            const list = await r.json();
            document.getElementById("total").innerText = list.length;
            
            if (list.length === 0) {
                listEl.innerHTML = "<div style='color:#444; text-align:center; padding:20px;'>Nenhum replay na nuvem.</div>";
                return;
            }

            const html = list.map(item => `
                <div class="item">
                    <div class="item-info">
                        <strong>LANCE ${item.time}</strong>
                        <span>Arena Jaguar</span>
                    </div>
                    <div class="actions">
                        <a href="${item.url}" target="_blank" class="btn-mini btn-view">ASSISTIR REPLAY</a>
                    </div>
                </div>
            `).join('');

            listEl.innerHTML = html;
            document.getElementById("cloud-status").innerText = "ONLINE";
            document.getElementById("cloud-status").style.color = "var(--primary)";
        } catch (e) {
            listEl.innerHTML = "<div style='color:#444; text-align:center; padding:20px;'>Aguardando primeiro clipe...</div>";
            document.getElementById("cloud-status").innerText = "EMPTY";
        }
    }

    // 2. Verifica se o notebook (main.py) está ligado
    async function statusLoad() {
        const statusEl = document.getElementById("status");
        try {
            // Tentativa de conexão com o notebook local
            const r = await fetch(`${API_LOCAL}/api/status`, { signal: AbortSignal.timeout(2000) });
            if(r.ok) {
                statusEl.innerHTML = '<span class="online">● ARENA CONECTADA</span>';
            } else {
                throw new Error();
            }
        } catch (e) {
            statusEl.innerHTML = '<span class="offline">● NOTEBOOK OFFLINE</span>';
        }
    }

    // 3. Envia o comando de gravar para o notebook
    async function gravar() {
        const btn = document.getElementById("saveBtn");
        btn.disabled = true;
        btn.innerText = "⏳ PROCESSANDO...";
        btn.style.background = "#333";

        try {
            const r = await fetch(`${API_LOCAL}/api/trigger`, { method: "POST" });
            const j = await r.json();

            if (j.success) {
                btn.innerText = "✅ GRAVADO COM SUCESSO!";
                btn.style.background = "var(--primary)";
                // Aguarda 5 segundos para o upload terminar e atualiza a lista
                setTimeout(clipsLoad, 5000);
            } else {
                throw new Error();
            }
        } catch (e) {
            btn.innerText = "❌ ERRO DE CONEXÃO";
            btn.style.background = "var(--danger)";
            alert("O site não conseguiu falar com o notebook no IP " + IP_NOTEBOOK + ". Verifique se o main.py está aberto e se você permitiu 'Conteúdo Inseguro' no navegador.");
        }

        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "⚽ GRAVAR LANCE";
            btn.style.background = "";
        }, 4000);
    }

    // Inicialização
    statusLoad();
    clipsLoad();

    // Atualiza a lista da nuvem a cada 15 segundos
    setInterval(clipsLoad, 15000);
    // Atualiza status do notebook a cada 5 segundos
    setInterval(statusLoad, 5000);
</script>

</body>
</html>
