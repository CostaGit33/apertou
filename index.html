<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Apertou Gravou - Arena Jaguar</title>

    <style>
        :root {
            --primary: #00ff84;
            --danger: #ff4444;
            --bg: #0a0a0a;
            --card-bg: #111;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: #fff; line-height: 1.5; }

        header {
            padding: 1rem 5%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.25rem; font-weight: 900; color: var(--primary); letter-spacing: 1px; }
        .logo small { font-size: 0.6rem; color: #555; vertical-align: middle; }

        #status { font-size: 0.8rem; font-weight: bold; transition: 0.3s; }
        .online { color: var(--primary); }
        .offline { color: var(--danger); }

        main { max-width: 1000px; margin: auto; padding: 20px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; height: fit-content; }
        .title { font-size: 0.9rem; font-weight: 800; margin-bottom: 15px; color: #aaa; text-transform: uppercase; }

        #saveBtn {
            width: 100%;
            padding: 35px 20px;
            border: none;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: 900;
            background: var(--primary);
            color: #000;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 132, 0.15);
        }

        #saveBtn:hover { transform: scale(1.01); background: #00db72; }
        #saveBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background: #333; color: #666; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .box { background: #0d0d0d; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #1a1a1a; }
        .box small { display: block; color: #666; font-size: 0.7rem; margin-bottom: 4px; }
        .box strong { font-size: 1.25rem; color: var(--primary); }

        .list { display: grid; gap: 10px; max-height: 550px; overflow-y: auto; padding-right: 5px; }
        .list::-webkit-scrollbar { width: 4px; }
        .list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .item {
            background: #0d0d0d;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1a1a1a;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .item-info strong { display: block; font-size: 0.9rem; color: #eee; }
        .item-info span { font-size: 0.75rem; color: #555; }

        .actions { display: flex; gap: 8px; }
        .btn-mini {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-view { background: #0070f3; color: #fff; }
        .btn-view:hover { background: #0060d0; }

        footer { padding: 40px 20px; text-align: center; color: #444; font-size: 0.75rem; }
    </style>
</head>

<body>

<header>
    <div class="logo">APERTOU GRAVOU <small>v6 ONLINE</small></div>
    <div id="status">● VERIFICANDO...</div>
</header>

<main>
    <div class="grid">
        <div class="card">
            <div class="title">Controle de Gravação</div>
            <button id="saveBtn" onclick="gravar()">⚽ GRAVAR LANCE</button>

            <div class="stats">
                <div class="box">
                    <small>STATUS R2</small>
                    <strong id="cloud-status">OK</strong>
                </div>
                <div class="box">
                    <small>TOTAL CLIPS</small>
                    <strong id="total">0</strong>
                </div>
            </div>
            
            <p style="margin-top: 20px; color: #555; font-size: 11px;">
                * Os vídeos são processados localmente e enviados para o Cloudflare R2 automaticamente.
            </p>
        </div>

        <div class="card">
            <div class="title">Últimos Replays</div>
            <div class="list" id="clips">
                <div style="text-align: center; padding: 20px; color: #444;">Buscando replays na nuvem...</div>
            </div>
        </div>
    </div>
</main>

<footer>
    Arena Jaguar • videos.semdominio.online • R2 Storage
</footer>

<script>
    // Agora apontando para o IP real da sua VPS que aparece no seu DNS
    const API = "http://76.13.68.129:8080"; 
    
    // URL Pública do seu R2 (confirmada na sua captura de tela do bucket)
    const R2_PUBLIC_URL = "https://pub-172de93c1f6b4da4bd4279b3ee4148c8.r2.dev";

    async function statusLoad() {
        try {
            const r = await fetch(`${API}/api/status`);
            const j = await r.json();
            document.getElementById("status").innerHTML = '<span class="online">● SISTEMA ONLINE</span>';
            document.getElementById("buffer").innerText = (j.buffer_seconds || 0) + "s";
        } catch (e) {
            document.getElementById("status").innerHTML = '<span class="offline">● SISTEMA OFFLINE</span>';
        }
    }

    async function clipsLoad() {
        try {
            // Buscando o índice diretamente do R2 para evitar sobrecarga na VPS
            const r = await fetch(`${R2_PUBLIC_URL}/clips.json?t=${Date.now()}`);
            if(!r.ok) throw new Error();
            const list = await r.json();
            
            document.getElementById("total").innerText = list.length;
            let html = "";

            list.forEach(item => {
                html += `
                <div class="item">
                    <div class="item-info">
                        <strong>LANCE - ${item.time}</strong>
                        <span>Arena Jaguar</span>
                    </div>
                    <div class="actions">
                        <a href="${item.url}" target="_blank" class="btn-mini btn-r2">ASSISTIR REPLAY</a>
                    </div>
                </div>`;
            });
            document.getElementById("clips").innerHTML = html;
        } catch (e) { 
            document.getElementById("clips").innerHTML = "<div style='color:#444;text-align:center;padding:20px;'>Sem vídeos na nuvem.</div>";
        }
    }

    async function gravar() {
        const btn = document.getElementById("saveBtn");
        btn.disabled = true;
        btn.innerText = "⏳ PROCESSANDO...";

        try {
            const r = await fetch(`${API}/api/trigger`, { method: "POST" });
            const j = await r.json();
            if (j.success) {
                btn.innerText = "✅ GRAVADO!";
                setTimeout(clipsLoad, 5000);
            }
        } catch (e) {
            alert("Erro ao conectar com a VPS (76.13.68.129). Verifique se a porta 8080 está aberta no firewall.");
        }

        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "⚽ GRAVAR LANCE";
        }, 5000);
    }

    statusLoad();
    clipsLoad();
    setInterval(statusLoad, 5000);
</script>

</body>
</html>
